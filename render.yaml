# Описание развёртывания для Render: веб-сервис из Dockerfile плюс база.
# Подключается как Blueprint — Render читает этот файл из репозитория и создаёт
# оба ресурса сам, вместе с переменной DATABASE_URL.
#
# Инстанс обязан быть ровно один. Раунды, брокер сообщений и сессии живут в
# памяти процесса: второй экземпляр начал бы крутить собственные раунды, и люди
# на одном и том же адресе видели бы разные шары. Поэтому никакого
# масштабирования — на бесплатном тарифе его и нет.

services:
  - type: web
    name: balloon
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # Автодеплой при пуше в main — то, ради чего это всё и затевалось.
    autoDeploy: true
    # Проверять живость нужно по корню: весь /api/** закрыт аутентификацией и
    # ответил бы проверке 401, из-за чего деплой считался бы неудачным.
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: balloon-db
          property: connectionString
      - key: SPRING_PROFILES_ACTIVE
        value: prod

databases:
  - name: balloon-db
    plan: free
    region: frankfurt
    databaseName: balloon
    user: balloon
