# Профиль публичного развёртывания. Включается переменной
# SPRING_PROFILES_ACTIVE=prod — она задана в Dockerfile.
#
# Локальная разработка сюда не заглядывает: application.properties остаётся
# как был, с файловой H2 и подробными логами.

# --- База ---
# Адрес, логин, пароль и драйвер приходят из окружения: docker-entrypoint.sh
# разбирает DATABASE_URL, который даёт Render, и выставляет переменные
# SPRING_DATASOURCE_*. Поэтому здесь про подключение не сказано ничего.
#
# Если базу не подключили, в силе остаётся файловая H2 из application.properties:
# прототип поднимется и будет играбелен, просто данные не переживут перезапуск.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Безопасность ---
# Консоль базы наружу не торчит: она закрыта ролью админа, но публичный адрес —
# не место для веб-доступа к таблицам.
spring.h2.console.enabled=false

# Кука сессии только по HTTPS. Render отдаёт сайт по HTTPS всегда, а без флага
# она уехала бы и по обычному http, случись редирект.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Приложение живёт за обратным прокси: без этого Spring считает, что запрос
# пришёл по http на внутренний порт, и ломает редиректы и абсолютные адреса.
server.forward-headers-strategy=native

# --- Файлы игры ---
# Рабочая папка контейнера — /app, репозитория рядом нет. Обоих файлов там
# изначально нет, и приложение разворачивает эталонные копии из jar; правка
# game.json через админку работает и здесь, но живёт до перезапуска.
game.config-path=config/game.json
game.rules-path=docs/rules.md

# --- Логи ---
# DEBUG на каждый пройденный уровень и каждую ставку — это десятки строк в
# секунду на бесплатном тарифе, где процессорного времени десятая доля ядра.
logging.level.ru.stoloto.balloon=INFO
logging.level.org.springframework.web.socket=WARN
