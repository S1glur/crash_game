spring.application.name=balloon

# Порт из окружения: хостинг назначает его сам и передаёт переменной PORT, а
# слушать другой — значит не пройти проверку готовности и получить деплой,
# который «не отвечает». Локально по-прежнему 8080.
server.port=${PORT:8080}

# --- H2 (файл) ---
# Файловая база, а не in-memory: аккаунты должны переживать перезапуск сервера,
# иначе зарегистрированный игрок исчезал бы вместе с процессом.
spring.datasource.url=jdbc:h2:file:./data/balloon
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Game config ---
# Путь к config/game.json относительно корня репозитория.
# Файл перечитывается на каждый новый раунд (hot-reload, сценарий 5 из ТЗ).
game.config-path=../config/game.json

# --- Сессия ---
# SameSite=Lax не даст браузеру приложить сессионную куку к межсайтовому запросу —
# на этом держится отказ от CSRF-токенов (см. SecurityConfig).
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# --- Logging ---
logging.level.ru.stoloto.balloon=DEBUG

# Путь к тексту правил (единственный источник — docs/rules.md)
game.rules-path=../docs/rules.md
