spring.application.name=balloon

# --- H2 (in-memory) ---
spring.datasource.url=jdbc:h2:mem:balloon;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Game config ---
# Путь к config/game.json относительно корня репозитория.
# Файл перечитывается на каждый новый раунд (hot-reload, сценарий 5 из ТЗ).
game.config-path=../config/game.json

# --- Logging ---
logging.level.ru.stoloto.balloon=DEBUG

# Путь к тексту правил (единственный источник — docs/rules.md)
game.rules-path=../docs/rules.md
